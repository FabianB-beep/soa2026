<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cornhole Admin – S:O:A 2026</title>
  <link rel="stylesheet" href="styles.css?v=8416cdf" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <meta name="theme-color" content="#0a0003" />
  <style>
    .admin-page { padding: 100px 0 80px; }
    .admin__topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:48px; flex-wrap:wrap; gap:16px; }
    .admin__logout { font-size:0.82rem; font-weight:600; color:var(--text-muted); border:1px solid var(--border); border-radius:999px; padding:7px 18px; cursor:pointer; background:none; transition:var(--transition); }
    .admin__logout:hover { color:var(--accent); border-color:var(--accent); }

    /* GitHub Einstellungen */
    .gh-settings { background:var(--bg-2); border:1px solid var(--border); border-radius:var(--r-lg); padding:20px 24px; margin-bottom:40px; }
    .gh-settings__toggle { display:flex; align-items:center; justify-content:space-between; cursor:pointer; user-select:none; }
    .gh-settings__toggle-label { font-size:0.85rem; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.08em; }
    .gh-settings__toggle-icon { color:var(--text-muted); font-size:0.8rem; transition:transform 0.2s; }
    .gh-settings--open .gh-settings__toggle-icon { transform:rotate(180deg); }
    .gh-settings__fields { display:none; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
    .gh-settings--open .gh-settings__fields { display:grid; }
    .gh-settings__field { display:flex; flex-direction:column; gap:6px; }
    .gh-settings__field--full { grid-column:1 / -1; }
    .gh-settings__label { font-size:0.75rem; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.07em; }
    .gh-settings__input { background:var(--bg-3); border:1px solid var(--border); border-radius:var(--r-md); padding:9px 12px; color:var(--text); font-size:0.85rem; font-family:var(--font-body); outline:none; transition:border-color 0.2s; }
    .gh-settings__input:focus { border-color:var(--accent); }
    .gh-settings__status { margin-top:10px; font-size:0.8rem; color:#4caf50; min-height:18px; }

    /* Ergebniseingabe */
    .re-group { margin-bottom:32px; }
    .re-group__title { font-family:var(--font-display); font-size:0.8rem; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; color:var(--accent-2); margin-bottom:10px; }
    .re-matches { display:flex; flex-direction:column; gap:6px; }
    .re-match { display:grid; grid-template-columns:52px 1fr auto 1fr 28px; align-items:center; gap:10px; background:var(--bg-3); border:1px solid var(--border); border-radius:var(--r-md); padding:10px 14px; }
    .re-match__time { font-size:0.78rem; color:var(--text-muted); font-weight:600; white-space:nowrap; }
    .re-match__team { font-size:0.85rem; font-weight:500; }
    .re-match__team--right { text-align:right; }
    .re-match__score { display:flex; align-items:center; gap:6px; flex-shrink:0; }
    .re-match__input { width:48px; background:var(--bg-2); border:1px solid var(--border); border-radius:8px; padding:6px 0; text-align:center; color:var(--text); font-size:0.95rem; font-weight:700; font-family:var(--font-display); outline:none; transition:border-color 0.2s; }
    .re-match__input:focus { border-color:var(--accent); }
    .re-match__done { width:18px; height:18px; accent-color:var(--accent); cursor:pointer; }
    .re-match__sep { color:var(--text-muted); font-weight:700; }
    .re-actions { display:flex; align-items:center; gap:16px; margin-top:28px; flex-wrap:wrap; }
    .re-save-btn { padding:12px 32px; background:var(--gradient); border:none; border-radius:999px; color:#fff; font-size:0.9rem; font-weight:700; font-family:var(--font-display); letter-spacing:0.05em; cursor:pointer; transition:opacity 0.2s,box-shadow 0.2s; }
    .re-save-btn:hover { opacity:0.9; box-shadow:0 0 20px rgba(204,17,0,0.4); }
    .re-save-btn:disabled { opacity:0.4; cursor:default; box-shadow:none; }
    .re-status { font-size:0.85rem; color:var(--text-muted); min-height:20px; }
    .re-status--ok  { color:#4caf50; }
    .re-status--err { color:var(--accent); }

    .re-match--ko { grid-template-columns: 52px 1fr; grid-template-rows: auto auto; }
    .re-match__ko-teams { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .re-match__field-info { grid-column: 1 / -1; font-size: 0.75rem; color: var(--text-muted); }
    .re-match__select {
      flex: 1;
      min-width: 140px;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      color: var(--text);
      font-size: 0.82rem;
      font-family: var(--font-body);
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .re-match__select:focus { border-color: var(--accent); }

    @media (max-width:600px) {
      .gh-settings__fields { grid-template-columns:1fr; }
      .re-match { grid-template-columns:44px 1fr 28px; grid-template-rows:auto auto; }
      .re-match__score { grid-column:1 / -1; justify-content:center; }
      .re-match__done { grid-row:1; grid-column:3; }
      .re-match__team--right { text-align:left; }
      .re-match__ko-teams { flex-direction: column; align-items: stretch; }
      .re-match__select { min-width: unset; }
    }
  </style>
</head>
<body>

  <script>
    if (localStorage.getItem("soa_admin") !== "1") location.replace("admin.html");
  </script>

  <!-- NAV -->
  <nav class="nav" id="nav">
    <div class="nav__logo">
      <a href="index.html" style="text-decoration:none;color:inherit">S:O:A 2026</a>
    </div>
    <button class="nav__burger" id="burger" aria-label="Menü öffnen">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav__links" id="navLinks">
      <li><a href="index.html#home"     class="nav__link">Start</a></li>
      <li><a href="index.html#cornhole" class="nav__link">Cornhole</a></li>
    </ul>
  </nav>

  <section class="admin-page">
    <div class="container">

      <div class="admin__topbar">
        <div>
          <span class="section__tag">Admin</span>
          <h1 class="section__title" style="margin-bottom:0">Cornhole Ergebnisse</h1>
          <p style="color:var(--text-muted);font-size:0.9rem;margin-top:6px">Sa, 27. Juni 2026 · ab 16:00 Uhr</p>
        </div>
        <button class="admin__logout" id="logoutBtn">Abmelden</button>
      </div>

      <!-- GitHub Einstellungen -->
      <div class="gh-settings" id="ghSettings">
        <div class="gh-settings__toggle" id="ghToggle">
          <span class="gh-settings__toggle-label">GitHub Einstellungen</span>
          <span class="gh-settings__toggle-icon">▼</span>
        </div>
        <div class="gh-settings__fields">
          <div class="gh-settings__field gh-settings__field--full">
            <label class="gh-settings__label">Personal Access Token</label>
            <input class="gh-settings__input" type="password" id="ghToken" placeholder="ghp_…" autocomplete="off" />
          </div>
          <div class="gh-settings__field">
            <label class="gh-settings__label">Repository</label>
            <input class="gh-settings__input" type="text" id="ghRepo" placeholder="owner/repo" />
          </div>
          <div class="gh-settings__field">
            <label class="gh-settings__label">Branch</label>
            <input class="gh-settings__input" type="text" id="ghBranch" placeholder="main" />
          </div>
        </div>
        <div class="gh-settings__status" id="ghSettingsStatus"></div>
      </div>

      <!-- Match-Eingabe -->
      <div id="reMatches"></div>

      <div class="re-actions">
        <button class="re-save-btn" id="reSaveBtn">Speichern & Committen</button>
        <span class="re-status" id="reStatus"></span>
      </div>

    </div>
  </section>

  <script src="data.js?v=0766bf3"></script>
  <script>!function(){var s=document.createElement('script');s.src='results.js?nc='+Date.now();s.onload=function(){var s2=document.createElement('script');s2.src='scores.js?nc='+Date.now();s2.onload=function(){init();};document.head.appendChild(s2);};document.head.appendChild(s);}()</script>
  <script>
  function init() {
    // Nav
    const nav      = document.getElementById("nav");
    const burger   = document.getElementById("burger");
    const navLinks = document.getElementById("navLinks");
    window.addEventListener("scroll", () => nav.classList.toggle("nav--scrolled", window.scrollY > 50));
    burger.addEventListener("click", () => {
      navLinks.classList.toggle("nav__links--open");
      burger.classList.toggle("nav__burger--open");
    });

    // Logout
    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("soa_admin");
      location.replace("index.html");
    });

    // Daten zusammenführen
    if (typeof CORNHOLE_TEAMS_CONFIG !== "undefined")
      CORNHOLE_TEAMS_CONFIG.forEach(t => CORNHOLE_TEAMS.push({ ...t, players: [] }));
    if (typeof CORNHOLE_MATCHES_CONFIG !== "undefined")
      CORNHOLE_MATCHES_CONFIG.forEach(m => CORNHOLE_MATCHES.push({ ...m, team1: null, team2: null, score1: null, score2: null, done: false }));
    if (typeof CORNHOLE_PAIRINGS !== "undefined")
      CORNHOLE_MATCHES.forEach(m => {
        if (CORNHOLE_PAIRINGS[m.id]) { m.team1 = CORNHOLE_PAIRINGS[m.id][0]; m.team2 = CORNHOLE_PAIRINGS[m.id][1]; }
      });
    if (typeof CORNHOLE_KO_PAIRINGS !== "undefined")
      CORNHOLE_MATCHES.forEach(m => {
        if (CORNHOLE_KO_PAIRINGS[m.id]) { m.team1 = CORNHOLE_KO_PAIRINGS[m.id][0]; m.team2 = CORNHOLE_KO_PAIRINGS[m.id][1]; }
      });
    if (typeof CORNHOLE_RESULTS !== "undefined")
      CORNHOLE_MATCHES.forEach(m => {
        const r = CORNHOLE_RESULTS[m.id];
        if (r && typeof r[0] === "number" && typeof r[1] === "number") { m.score1 = r[0]; m.score2 = r[1]; m.done = !!r[2]; }
      });

    const teamMap = Object.fromEntries(CORNHOLE_TEAMS.map(t => [t.id, t]));

    // GitHub Einstellungen (localStorage)
    const LS_TOKEN  = "soa_gh_token";
    const LS_REPO   = "soa_gh_repo";
    const LS_BRANCH = "soa_gh_branch";

    const ghTokenEl  = document.getElementById("ghToken");
    const ghRepoEl   = document.getElementById("ghRepo");
    const ghBranchEl = document.getElementById("ghBranch");

    ghTokenEl.value  = localStorage.getItem(LS_TOKEN)  || "";
    ghRepoEl.value   = localStorage.getItem(LS_REPO)   || "fabianb-beep/soa2026";
    ghBranchEl.value = localStorage.getItem(LS_BRANCH) || "claude/serene-hawking-3oijvj";

    [ghTokenEl, ghRepoEl, ghBranchEl].forEach(el => {
      el.addEventListener("input", () => {
        localStorage.setItem(LS_TOKEN,  ghTokenEl.value.trim());
        localStorage.setItem(LS_REPO,   ghRepoEl.value.trim());
        localStorage.setItem(LS_BRANCH, ghBranchEl.value.trim());
        document.getElementById("ghSettingsStatus").textContent = "Gespeichert.";
        setTimeout(() => document.getElementById("ghSettingsStatus").textContent = "", 1500);
      });
    });

    const ghSettings = document.getElementById("ghSettings");
    if (!ghTokenEl.value) ghSettings.classList.add("gh-settings--open");
    document.getElementById("ghToggle").addEventListener("click", () =>
      ghSettings.classList.toggle("gh-settings--open")
    );

    // Team-Dropdown HTML für KO-Matches
    const teamOptions = CORNHOLE_TEAMS.map(t =>
      `<option value="${t.id}">${t.name}</option>`
    ).join("");

    function teamSelect(matchId, side, currentTeamId) {
      return `
        <select class="re-match__select" data-match="${matchId}" data-team="${side}">
          <option value="">– Team wählen –</option>
          ${CORNHOLE_TEAMS.map(t =>
            `<option value="${t.id}"${t.id === currentTeamId ? " selected" : ""}>${t.name}</option>`
          ).join("")}
        </select>`;
    }

    // Matches rendern
    function renderReMatches() {
      const container = document.getElementById("reMatches");
      const rounds = ["Gruppenphase", "Halbfinale", "Platz 3", "Finale"];
      const groups = { Gruppenphase: ["A", "B", "C"] };
      let html = "";
      rounds.forEach(round => {
        const subGroups = groups[round] || [null];
        subGroups.forEach(group => {
          const matches = CORNHOLE_MATCHES.filter(m =>
            m.round === round && (group ? m.group === group : m.group === null)
          );
          if (!matches.length) return;
          const isKO  = group === null;
          const label = group ? `Gruppenphase ${group} · Feld ${matches[0].field}` : round;
          html += `<div class="re-group"><div class="re-group__title">${label}</div><div class="re-matches">`;
          matches.forEach(m => {
            const v1 = m.score1 !== null ? m.score1 : "";
            const v2 = m.score2 !== null ? m.score2 : "";
            if (isKO) {
              const koDone = m.done ? "checked" : "";
              html += `
                <div class="re-match re-match--ko">
                  <div class="re-match__time">${m.time}</div>
                  <div class="re-match__ko-teams">
                    ${teamSelect(m.id, 1, m.team1)}
                    <div class="re-match__score">
                      <input class="re-match__input" type="number" min="0" max="99"
                             data-match="${m.id}" data-side="1" value="${v1}" placeholder="–" />
                      <span class="re-match__sep">:</span>
                      <input class="re-match__input" type="number" min="0" max="99"
                             data-match="${m.id}" data-side="2" value="${v2}" placeholder="–" />
                    </div>
                    ${teamSelect(m.id, 2, m.team2)}
                  </div>
                  <div class="re-match__field-info">Feld ${m.field}</div>
                  <input class="re-match__done" type="checkbox" data-match="${m.id}" title="Spiel beendet" ${koDone} />
                </div>`;
            } else {
              const t1 = teamMap[m.team1]?.name || (m.label1 || "TBD");
              const t2 = teamMap[m.team2]?.name || (m.label2 || "TBD");
              const done = m.done ? "checked" : "";
              html += `
                <div class="re-match">
                  <div class="re-match__time">${m.time}</div>
                  <div class="re-match__team">${t1}</div>
                  <div class="re-match__score">
                    <input class="re-match__input" type="number" min="0" max="99"
                           data-match="${m.id}" data-side="1" value="${v1}" placeholder="–" />
                    <span class="re-match__sep">:</span>
                    <input class="re-match__input" type="number" min="0" max="99"
                           data-match="${m.id}" data-side="2" value="${v2}" placeholder="–" />
                  </div>
                  <div class="re-match__team re-match__team--right">${t2}</div>
                  <input class="re-match__done" type="checkbox" data-match="${m.id}" title="Spiel beendet" ${done} />
                </div>`;
            }
          });
          html += "</div></div>";
        });
      });
      container.innerHTML = html;
    }
    renderReMatches();

    function readScores() {
      const scores = {};
      document.querySelectorAll(".re-match__input[data-side='1']").forEach(input => {
        const id = Number(input.dataset.match);
        const other = document.querySelector(`.re-match__input[data-match="${id}"][data-side="2"]`);
        const v1 = input.value.trim(), v2 = other?.value.trim();
        if (v1 === "" && v2 === "") return;
        const done = document.querySelector(`.re-match__done[data-match="${id}"]`)?.checked || false;
        scores[id] = [Number(v1 || 0), Number(v2 || 0), done];
      });
      return scores;
    }

    function readKOPairings() {
      const pairings = {};
      document.querySelectorAll(".re-match__select[data-team='1']").forEach(sel => {
        const id  = Number(sel.dataset.match);
        const sel2 = document.querySelector(`.re-match__select[data-match="${id}"][data-team="2"]`);
        const t1 = Number(sel.value), t2 = Number(sel2?.value);
        pairings[id] = (t1 && t2) ? [t1, t2] : null;
      });
      return pairings;
    }

    function buildResultsBlock(scores) {
      const lines = ["const CORNHOLE_RESULTS = {"];
      const groupMatches = CORNHOLE_MATCHES.filter(m => m.group !== null);
      ["A", "B", "C"].forEach(g => {
        lines.push(`  // Gruppenphase ${g}`);
        groupMatches.filter(m => m.group === g).forEach(m => {
          if (scores[m.id]) lines.push(`  ${m.id}: [${scores[m.id][0]}, ${scores[m.id][1]}, ${scores[m.id][2]}],`);
        });
      });
      const koMatches = CORNHOLE_MATCHES.filter(m => m.group === null);
      lines.push("  // Halbfinale");
      koMatches.filter(m => m.round === "Halbfinale").forEach(m => {
        if (scores[m.id]) lines.push(`  ${m.id}: [${scores[m.id][0]}, ${scores[m.id][1]}],`);
      });
      lines.push("  // Platz 3 & Finale");
      koMatches.filter(m => m.round !== "Halbfinale").forEach(m => {
        if (scores[m.id]) lines.push(`  ${m.id}: [${scores[m.id][0]}, ${scores[m.id][1]}],`);
      });
      lines.push("};");
      return lines.join("\n");
    }

    function buildScoresFile(scores, koPairings) {
      const lines = [
        "// ── ERGEBNISSE & KO-PAARUNGEN ────────────────────────────────────────────────",
        "// Diese Datei wird vom Admin-Bereich und Power Automate aktualisiert.",
        "// Format:  Match-ID : [Punkte Team 1, Punkte Team 2]",
        "",
      ];
      lines.push(...buildResultsBlock(scores).split("\n"));
      lines.push("");
      lines.push(...buildKOPairingsBlock(koPairings).split("\n"));
      return lines.join("\n") + "\n";
    }

    function buildKOPairingsBlock(koPairings) {
      const koMatches = CORNHOLE_MATCHES.filter(m => m.group === null);
      const lines = [
        "const CORNHOLE_KO_PAIRINGS = {",
        "  // Halbfinale",
        ...koMatches.filter(m => m.round === "Halbfinale").map(m => koPairings[m.id] ? `  ${m.id}: [${koPairings[m.id][0]}, ${koPairings[m.id][1]}],` : "").filter(Boolean),
        "  // Platz 3 & Finale",
        ...koMatches.filter(m => m.round !== "Halbfinale").map(m => koPairings[m.id] ? `  ${m.id}: [${koPairings[m.id][0]}, ${koPairings[m.id][1]}],` : "").filter(Boolean),
        "};",
      ];
      return lines.join("\n");
    }

    async function commitToGitHub(scores, koPairings) {
      const token  = localStorage.getItem(LS_TOKEN)  || "";
      const repo   = localStorage.getItem(LS_REPO)   || "";
      const branch = localStorage.getItem(LS_BRANCH) || "main";
      if (!token) throw new Error("Kein GitHub Token hinterlegt.");
      if (!repo)  throw new Error("Kein Repository hinterlegt.");
      const headers = { Authorization: `Bearer ${token}`, "Content-Type": "application/json" };
      const getRes = await fetch(
        `https://api.github.com/repos/${repo}/contents/scores.js?ref=${branch}`, { headers }
      );
      if (!getRes.ok) throw new Error(`scores.js nicht gefunden (${getRes.status}). Token/Repo/Branch prüfen.`);
      const fileData = await getRes.json();
      const content = buildScoresFile(scores, koPairings);
      const putRes = await fetch(
        `https://api.github.com/repos/${repo}/contents/scores.js`,
        {
          method: "PUT",
          headers,
          body: JSON.stringify({
            message: "Cornhole Ergebnisse & KO-Paarungen aktualisiert",
            content: btoa(unescape(encodeURIComponent(content))),
            sha: fileData.sha,
            branch,
          }),
        }
      );
      if (!putRes.ok) {
        const err = await putRes.json();
        throw new Error(err.message || `Fehler ${putRes.status}`);
      }
    }

    document.getElementById("reSaveBtn").addEventListener("click", async () => {
      const btn    = document.getElementById("reSaveBtn");
      const status = document.getElementById("reStatus");
      btn.disabled = true;
      status.className = "re-status";
      status.textContent = "Wird gespeichert…";
      try {
        await commitToGitHub(readScores(), readKOPairings());
        status.className = "re-status re-status--ok";
        status.textContent = "✓ Erfolgreich committet.";
      } catch (e) {
        status.className = "re-status re-status--err";
        status.textContent = "✗ " + e.message;
      } finally {
        btn.disabled = false;
      }
    });
  }
  </script>

</body>
</html>
